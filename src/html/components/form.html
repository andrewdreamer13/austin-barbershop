<form
  class="form {=$class}"
  id="{=$id}"
  action="https://api.web3forms.com/submit"
  method="POST"
  novalidate
  data-country="us"
  data-modal-success="modal-success"
>
  <input
    type="hidden"
    name="access_key"
    value="0d0b7a66-56f9-4ab4-a8f9-a92b96d45986"
  />

  <input
    type="hidden"
    name="subject"
    value="New Appointment Request — Austin Barbershop"
  />

  <input
    type="hidden"
    name="from_name"
    value="Austin Barbershop Website"
  />

  <input
    type="hidden"
    name="Form Name"
    value="Appointment Form"
  />

  <input
    type="checkbox"
    name="botcheck"
    hidden
  />

  <div class="form__input-box">
    <label
      class="form__label"
      for="name"
    >
      First Name
    </label>

    <input
      class="form__input"
      id="name"
      type="text"
      name="name"
      placeholder="Type first name"
      autocomplete="given-name"
      required
      aria-describedby="name-error"
    />

    <span
      class="form__error"
      id="name-error"
    ></span>
  </div>

  <div class="form__input-box">
    <label
      class="form__label"
      for="last-name"
    >
      Last Name
    </label>

    <input
      class="form__input"
      id="last-name"
      type="text"
      name="lastName"
      placeholder="Type last name"
      autocomplete="family-name"
      required
      aria-describedby="last-name-error"
    />

    <span
      class="form__error"
      id="last-name-error"
    ></span>
  </div>

  <div class="form__input-box">
    <label
      class="form__label"
      for="email"
    >
      Email
    </label>

    <input
      class="form__input"
      id="email"
      type="email"
      name="email"
      placeholder="Type email address"
      autocomplete="email"
      required
      aria-describedby="email-error"
    />

    <span
      class="form__error"
      id="email-error"
    ></span>
  </div>

  <div class="form__input-box">
    <label
      class="form__label"
      for="phone"
    >
      Phone Number
    </label>

    <input
      class="form__input"
      id="phone"
      type="tel"
      name="phone"
      placeholder="Type phone number"
      autocomplete="tel"
      required
      aria-describedby="phone-error"
    />

    <span
      class="form__error"
      id="phone-error"
    ></span>
  </div>

  <div class="form__input-box">
    <label class="form__label" for="select-button"> Select Services </label>

    <div
      class="select"
      id="services"
    >
      <button
        class="select__button"
        id="select-button"
        type="button"
        aria-haspopup="listbox"
        aria-expanded="false"
        aria-describedby="services-error"
      >
        Select services
      </button>

      <ul
        class="select__options"
        role="listbox"
      >
      
      </ul>

      <input
        class="select__input"
        type="hidden"
        name="services"
        value=""
        required
      />
    </div>
    <span
      class="form__error"
      id="services-error"
    ></span>
  </div>

  <div class="form__input-box">
    <label
      class="form__label"
      for="appointment-date"
    >
      Appointment Date
    </label>

    <input
      class="form__input"
      id="appointment-date"
      type="text"
      name="appointmentDate"
      placeholder="08/20/2026 7:30 PM"
      required
      aria-describedby="date-error"
    />
    <svg class="form__date-icon">
      <use href="#icons-calendar"></use>
    </svg>

    <span
      class="form__error"
      id="date-error"
    ></span>
  </div>

  <div class="form__input-box">
    <label
      class="form__label"
      for="message"
    >
      Message
    </label>

    <textarea
      class="form__textarea"
      id="message"
      name="message"
      rows="4"
      placeholder="Drop a line"
      aria-describedby="message-error"
    ></textarea>

    <span
      class="form__error"
      id="message-error"
    ></span>
  </div>

  <button
    class="form__submit button"
    type="submit"
  >
    <span>Submit</span>
  </button>
</form>
